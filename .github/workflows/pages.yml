name: Bangun dan terbitkan marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"     # tiap jam: menyegarkan katalog dari Apps Script

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bangun CSS Tailwind
        run: |
          npm install --no-audit --no-fund
          npm run css

      - name: Ambil produk aktif dari Apps Script
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: node scripts/ambil_produk.js

      - name: Periksa data produk sebelum Jekyll
        run: |
          echo "--- _data"; ls -la _data
          echo "--- assets/data"; ls -la assets/data
          echo "--- _produk"; ls _produk
          test -s _data/produk.json || { echo "GALAT: _data/produk.json kosong/tidak ada"; exit 1; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bangun situs Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Periksa hasil build memuat produk
        run: |
          echo "--- _site/assets/data"; ls -la _site/assets/data || true
          test -s _site/assets/data/produk.json || { echo "GALAT: produk.json tidak ada di _site"; exit 1; }
          echo "Isi produk.json (200 karakter pertama):"; head -c 200 _site/assets/data/produk.json; echo
          echo "--- halaman produk di _site/produk"; ls _site/produk | head -20
          grep -c 'data-produk=' _site/index.html || true

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
